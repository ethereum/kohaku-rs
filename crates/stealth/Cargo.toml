[package]
name = "kohaku-stealth"
version = "0.1.0"
edition = "2024"
description = "ERC-5564 scheme 3 client: register, announce, scan, and spend."
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
alloy = { workspace = true, features = [
    "contract",
    "network",
    "providers",
    "rpc",
    "rpc-types",
    "sol-types",
    "transports",
] }
futures = { workspace = true }
kohaku-rpc-provider = { workspace = true }
pqsa-core = { workspace = true }
pqsa-per-payment = { workspace = true }
rand = { workspace = true }
secrecy = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { version = "0.2", package = "getrandom", features = ["js"] }
getrandom_04 = { version = "0.4", package = "getrandom", features = ["wasm_js"] }

[dev-dependencies]
alloy = { workspace = true, features = [
    "json-rpc",
    "signer-local",
    "signers",
] }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
alloy = { workspace = true, features = ["provider-anvil-node"] }
anyhow = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
