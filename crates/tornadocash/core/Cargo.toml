[package]
name = "kohaku-tornadocash-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[features]
default = []
parallel = ["kohaku-tornadocash-circuit/parallel"]

[dependencies]
alloy = { workspace = true, features = [
    "rpc",
    "rpc-types",
    "network",
    "providers",
    "transports",
    "sol-types",
    "reqwest",
] }
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
ruint = { workspace = true, features = ["ark-ff-06", "num-bigint"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
websnark-rs = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }
num-bigint = { workspace = true }
blake-hash = { workspace = true }
kohaku-merkle-tree = { workspace = true }
kohaku-tornadocash-circuit = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
alloy = { workspace = true, features = [
    "signers",
    "signer-local",
    "provider-anvil-node",
] }
anyhow = { workspace = true }
insta = { workspace = true }
kohaku-fork-kit = { workspace = true }
kohaku-tornadocash-syncer = { workspace = true }
tokio = { workspace = true, features = ["macros", "process"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[build-dependencies]
cfg_aliases = { workspace = true }

[lints]
workspace = true
