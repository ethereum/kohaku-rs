[package]
name = "kohaku-tornadocash-circuit"
version = "0.1.0"
edition = "2024"
description = "Groth16 prover for the Tornado Cash withdrawal circuit"
license.workspace = true
repository.workspace = true
exclude = ["data/", "tests/", "benches/"]

[features]
default = []
parallel = ["websnark-rs/parallel"]

[dependencies]
postcard = { workspace = true }
rand = { workspace = true }
ruint = { workspace = true, features = ["ark-ff-06", "serde"] }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
websnark-rs = { workspace = true }

[dev-dependencies]
brotli = { workspace = true }
criterion = { workspace = true, features = ["async_tokio"] }
serde_json = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "prove"
harness = false
