[package]
name = "kohaku-tornadocash-paymaster"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[dependencies]
alloy = { workspace = true, features = [
    "rpc",
    "rpc-types",
    "network",
    "providers",
    "transports",
    "sol-types",
    "reqwest",
] }
rand = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
kohaku-userop-kit = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }
kohaku-merkle-tree = { workspace = true }
kohaku-tornadocash-core = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
alloy = { workspace = true, features = [
    "signers",
    "signer-local",
    "provider-anvil-node",
] }
anyhow = { workspace = true }
insta = { workspace = true }
kohaku-fork-kit = { workspace = true }
kohaku-tornadocash-syncer = { workspace = true }
tokio = { workspace = true, features = ["macros", "process"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[build-dependencies]
cfg_aliases = { workspace = true }

[lints]
workspace = true
