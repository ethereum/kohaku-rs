[package]
name = "kohaku-tornadocash-syncer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[features]
default = ["saga-sync"]
saga-sync = ["dep:flate2", "dep:sha2"]

[dependencies]
alloy = { workspace = true, features = [
    "rpc",
    "rpc-types",
    "network",
    "providers",
    "transports",
    "sol-types",
    "reqwest",
] }
async-trait = { workspace = true }
flate2 = { workspace = true, optional = true }
hex = { workspace = true }
kohaku-rpc-provider = { workspace = true }
kohaku-tornadocash = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[build-dependencies]
cfg_aliases = { workspace = true }

[dev-dependencies]
alloy = { workspace = true, features = [
    "signers",
    "signer-local",
    "provider-anvil-node",
] }
anyhow = { workspace = true }
insta = { workspace = true }
kohaku-fork-kit = { workspace = true }
tokio = { workspace = true, features = ["macros", "process"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
