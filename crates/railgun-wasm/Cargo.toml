[package]
name = "kohaku-railgun-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alloy = { workspace = true }
curve25519-dalek = { workspace = true }
hex = { workspace = true }
js-sys = { workspace = true }
kohaku-railgun = { workspace = true }
kohaku-railgun-poi = { workspace = true, features = ["userop"] }
kohaku-railgun-sync = { workspace = true }
kohaku-userop-kit = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tsify = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
