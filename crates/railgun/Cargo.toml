[package]
name = "kohaku-railgun"
version = "0.1.0"
edition = "2024"

[package.metadata.cargo-machete]
ignored = ["wasm-bindgen"]

[lib]
crate-type = ["rlib"]

[[bin]]
name = "main"
path = "bin/main.rs"

[features]
default = []
js = ["dep:tsify", "dep:wasm-bindgen"]
parallel = ["ark-groth16/parallel", "ark-ff/parallel", "ark-serialize/parallel"]
testing = []
bench = []

[dependencies]
# common = { workspace = true }
# kohaku-db = { workspace = true }
# crypto = { workspace = true }
alloy = { workspace = true }
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
num-bigint = { workspace = true, features = ["serde"] }
rand = { workspace = true }
ruint = { workspace = true, features = ["num-bigint"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
kohaku-userop-kit = { workspace = true }
wasm-bindgen = { version = "=0.2.108", optional = true }
brotli = { workspace = true }
anyhow = { workspace = true }
aes = "0.9.3"
aes-gcm = "0.11.1"
ark-circom = "0.6.0"
ark-groth16 = "0.6.0"
ark-relations = "0.6.0"
ark-serialize = "0.6.0"
ark-std = "0.6.0"
bech32 = "0.12.0"
ctr = "0.10.1"
curve25519-dalek = "5.0.0"
ed25519-dalek = "3.0.0"
rand_chacha = "0.10.0"
web-time = "1.1.0"
tsify = { version = "0.5.8", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, features = ["json", "rustls"] }
tokio = { workspace = true, features = ["fs"] }
tracing-subscriber = { workspace = true }
wasmer = { version = "6.1", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = [
    "wasm_js",
] }
# gloo-timers = { workspace = true, features = ["futures"] }
# js-sys = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
# tracing-wasm = { workspace = true }
wasmer = { version = "6.1", default-features = false, features = [
    "js-default",
] }

[build-dependencies]
cfg_aliases = { workspace = true }

[dev-dependencies]
alloy = { workspace = true, default-features = true }
insta = { workspace = true }
kohaku-railgun = { path = ".", features = ["testing"] }
# serial_test = { workspace = true }
tokio = { workspace = true, features = ["full"] }
# tracing-test = { workspace = true }
criterion = { workspace = true }
# kohaku-test-utils = { workspace = true }

[[bench]]
name = "indexed_account"
harness = false
