[package]
name = "kohaku-railgun-poi"
version = "0.1.0"
edition = "2024"

[features]
default = []
userop = ["dep:kohaku-railgun-paymaster"]

[dependencies]
alloy = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
kohaku-crypto = { workspace = true }
kohaku-merkle-tree = { workspace = true }
kohaku-railgun = { workspace = true }
kohaku-railgun-paymaster = { workspace = true, optional = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
ruint = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { workspace = true, features = ["futures"] }

[build-dependencies]
cfg_aliases = { workspace = true }

[dev-dependencies]
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }
ark-groth16 = { workspace = true }
alloy = { workspace = true, features = ["provider-anvil-node"] }
kohaku-railgun-sync = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
