[package]
name = "kohaku-tornadocash-circuit"
version = "0.1.0"
edition = "2024"

[features]
default = []
parallel = ["websnark-rs/parallel"]

[dependencies]
brotli = { workspace = true }
postcard = { workspace = true }
serde_json = { workspace = true }
websnark-rs = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
rand = { workspace = true }
ruint = { workspace = true, features = ["ark-ff-06"] }

[dev-dependencies]
tokio = { workspace = true }
criterion = { workspace = true, features = ["async_tokio"] }

[lints]
workspace = true

[[bench]]
name = "prove"
harness = false
