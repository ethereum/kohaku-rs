[package]
name = "kohaku-tacit-wasm"
version = "0.0.1"
edition = "2024"
description = "Tacit pool wasm bindings"
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alloy = { workspace = true, features = ["providers", "reqwest"] }
hex = { workspace = true }
js-sys = { workspace = true }
kohaku-tacit = { workspace = true, features = ["mnemonic"] }
kohaku-tacit-relayer = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "=0.4.58"

[dev-dependencies]
wasm-bindgen-test = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
getrandom_02 = { version = "0.2", features = ["js"], package = "getrandom" }

[lints]
workspace = true
