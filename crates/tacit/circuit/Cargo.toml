[package]
name = "kohaku-tacit-circuit"
version = "0.0.1"
edition = "2024"
description = "Tacit pool transaction circuit: witness generation and Groth16 proving from the ceremony artifacts"
license.workspace = true
repository.workspace = true

[features]
default = []
parallel = ["ark-ec/parallel", "ark-ff/parallel", "ark-poly/parallel"]

[dependencies]
ark-bn254 = { workspace = true }
ark-ec = { workspace = true }
ark-ff = { workspace = true }
ark-poly = { workspace = true }
rand_core = { workspace = true }
ruint = { workspace = true, features = ["ark-ff-06"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
wasmi = { workspace = true }

[dev-dependencies]
rand = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
