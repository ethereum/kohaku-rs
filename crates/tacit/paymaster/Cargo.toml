[package]
name = "kohaku-tacit-paymaster"
version = "0.0.1"
edition = "2024"
description = "Pay for a 4337 operation out of a Tacit pool note"
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib"]

[features]
default = []
parallel = ["kohaku-tacit/parallel"]

[dependencies]
alloy = { workspace = true, features = ["providers", "rpc-types", "sol-types"] }
kohaku-tacit = { workspace = true }
kohaku-userop-kit = { workspace = true }
rand_core = { workspace = true }
ruint = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
alloy = { workspace = true, features = ["dyn-abi", "signer-local", "signers", "sol-types"] }
async-trait = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
