[package]
name = "kohaku-tacit"
version = "0.0.1"
edition = "2024"
description = "Tacit shielded pool for Ethereum: keys, notes, sync and private transactions"
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib"]

[features]
default = []
mnemonic = ["alloy/signer-mnemonic"]
parallel = ["kohaku-tacit-circuit/parallel"]

[dependencies]
alloy = { workspace = true, features = [
    "contract",
    "network",
    "providers",
    "rpc-types",
    "sol-types",
] }
ark-bn254 = { workspace = true }
ark-ed-on-bn254 = { workspace = true }
ark-ff = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
k256 = { workspace = true, features = ["arithmetic", "std"] }
kohaku-rpc-provider = { workspace = true }
kohaku-tacit-circuit = { workspace = true }
rand_core = { workspace = true }
ruint = { workspace = true, features = ["ark-ff-06", "serde"] }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "=0.4.58"

[dev-dependencies]
alloy = { workspace = true, features = [
    "node-bindings",
    "provider-anvil-node",
    "signer-local",
    "signers",
] }
rand = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
