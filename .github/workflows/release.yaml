name: Release

on:
  push:
    tags: [ "kohaku-*-v*" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v31
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}

    - name: Check tag matches crate version
      id: crate
      run: |
        crate="${GITHUB_REF_NAME%-v*}"
        version="${GITHUB_REF_NAME##*-v}"
        if ! [[ "$crate" =~ ^[a-z0-9-]+$ ]]; then
          echo "::error::Invalid crate name '$crate' from tag $GITHUB_REF_NAME"
          exit 1
        fi
        actual=$(nix develop .#ci --command bash -c "cd crates && cargo pkgid -p $crate" | sed 's/.*@//')
        if [ "$actual" != "$version" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match $crate@$actual"
          exit 1
        fi
        echo "name=$crate" >> "$GITHUB_OUTPUT"

    - uses: rust-lang/crates-io-auth-action@v1
      id: auth

    - run: nix develop .#ci --command bash -c "cd crates && cargo publish --locked -p ${{ steps.crate.outputs.name }}"
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
